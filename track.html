<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Racing - Track Creator Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
            overflow: hidden;
        }
        
        /* Canvas shadow & styling */
        .canvas-container {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
            cursor: crosshair;
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }

        /* Glassmorphism panel styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Tool button active states */
        .tool-btn {
            transition: all 0.15s ease;
        }
        .tool-btn.active {
            background-color: #ef4444;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            border-color: #f87171;
        }

        /* Range slider styling */
        input[type=range] {
            accent-color: #ef4444;
        }

        /* Custom brush cursor preview */
        #brush-preview {
            pointer-events: none;
            position: absolute;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 50;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center relative overflow-hidden bg-slate-950">

    <!-- Brush Preview Circle -->
    <div id="brush-preview"></div>

    <!-- Top Floating Header / Bar -->
    <header class="absolute top-4 left-1/2 -translate-x-1/2 z-30 flex items-center gap-4 px-6 py-2.5 rounded-full glass-panel transition-all duration-300 hover:opacity-100 opacity-90">
        <div class="flex items-center gap-2 pr-4 border-r border-slate-700">
            <i class="fa-solid font-bold text-red-500 text-xl fa-flag-checkered"></i>
            <span class="font-bold text-lg tracking-wide bg-gradient-to-r from-red-400 to-rose-200 bg-clip-text text-transparent">TRACK BUILDER</span>
            <span class="text-xs bg-red-950 text-red-400 border border-red-800 px-2 py-0.5 rounded-full font-mono">1000x700</span>
        </div>
        
        <div class="flex items-center gap-2">
            <button id="undo-btn" title="Undo (Ctrl+Z)" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button id="redo-btn" title="Redo (Ctrl+Y)" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <div class="h-4 w-px bg-slate-700 mx-1"></div>
            <button id="toggle-grid" title="Toggle Overlay Grid (G)" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition">
                <i class="fa-solid fa-border-all"></i> <span class="text-xs ml-1 font-semibold">Grid</span>
            </button>
            <button id="clear-btn" title="Clear Canvas" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-red-900/50 hover:text-red-300 border border-slate-700 text-slate-300 transition">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>

        <div class="h-4 w-px bg-slate-700 mx-1"></div>

        <!-- Export/Import Buttons -->
        <div class="flex items-center gap-2">
            <label id="import-label" title="Import Existing Track Image" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 cursor-pointer text-xs font-semibold transition flex items-center gap-1.5">
                <i class="fa-solid fa-file-import"></i> Import
                <input type="file" id="import-file" accept="image/*" class="hidden">
            </label>
            <button id="export-png-btn" title="Export Track PNG (1000x700)" class="px-4 py-1.5 rounded-lg bg-red-600 hover:bg-red-500 text-white font-semibold text-xs transition flex items-center gap-1.5 shadow-lg shadow-red-600/30">
                <i class="fa-solid fa-download"></i> Export PNG
            </button>
            <button id="export-json-btn" title="Export Metadata JSON" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs font-semibold transition flex items-center gap-1.5">
                <i class="fa-solid fa-code"></i> JSON
            </button>
        </div>
    </header>

    <!-- Main Canvas Viewport Area -->
    <main class="w-full h-full flex items-center justify-center p-4 relative overflow-auto">
        <div id="canvas-wrapper" class="relative canvas-container rounded-xl overflow-hidden">
            <!-- Main Drawing Canvas -->
            <canvas id="track-canvas" width="1000" height="700" class="block bg-red-700"></canvas>
            <!-- Overlay Grid Canvas -->
            <canvas id="grid-canvas" width="1000" height="700" class="absolute top-0 left-0 pointer-events-none opacity-40 hidden"></canvas>
        </div>
    </main>

    <!-- Floating Tool Dock (Bottom Left/Center Overlay) -->
    <div id="toolbar" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-30 flex items-center gap-4 px-6 py-3 rounded-2xl glass-panel transition-all duration-300">
        
        <!-- Tools selector -->
        <div class="flex items-center gap-2 border-r border-slate-700 pr-4">
            <button id="tool-pen" title="Track Pen (B)" class="tool-btn active px-3.5 py-2 rounded-xl border border-slate-700 bg-slate-800 text-slate-200 flex items-center gap-2 text-sm font-semibold">
                <i class="fa-solid fa-pen-nib"></i>
                <span>Track Pen</span>
            </button>
            <button id="tool-eraser" title="Eraser (E)" class="tool-btn px-3.5 py-2 rounded-xl border border-slate-700 bg-slate-800 text-slate-200 flex items-center gap-2 text-sm font-semibold">
                <i class="fa-solid fa-eraser"></i>
                <span>Eraser</span>
            </button>
            <button id="tool-finish" title="Place Start/Finish Line (F)" class="tool-btn px-3.5 py-2 rounded-xl border border-slate-700 bg-slate-800 text-slate-200 flex items-center gap-2 text-sm font-semibold">
                <i class="fa-solid fa-flag-checkered"></i>
                <span>Start Line</span>
            </button>
        </div>

        <!-- Pen / Eraser Size Controls -->
        <div id="brush-controls" class="flex items-center gap-3">
            <i class="fa-solid fa-circle text-xs text-slate-400"></i>
            <input type="range" id="brush-size" min="5" max="150" value="60" class="w-32 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
            <span id="brush-size-val" class="font-mono text-xs w-10 text-slate-300 font-bold">60px</span>
        </div>

        <!-- Start Line Options (Shown when finish line tool active) -->
        <div id="finish-controls" class="hidden flex items-center gap-3 border-l border-slate-700 pl-4">
            <label class="text-xs text-slate-400 font-medium">Angle:</label>
            <input type="range" id="finish-angle" min="0" max="360" value="0" class="w-24 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
            <span id="finish-angle-val" class="font-mono text-xs text-slate-300 w-8">0°</span>
        </div>

        <!-- Smooth Line Toggle -->
        <div class="border-l border-slate-700 pl-4 flex items-center gap-2">
            <label class="inline-flex items-center cursor-pointer">
                <input type="checkbox" id="smooth-toggle" checked class="sr-only peer">
                <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-red-600"></div>
                <span class="ml-2 text-xs font-medium text-slate-300">Smooth Curves</span>
            </label>
        </div>

        <!-- UI Minimize / Auto-hide Button -->
        <button id="toggle-ui-btn" title="Toggle Minimal UI Mode" class="ml-2 px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs transition">
            <i class="fa-solid fa-compress"></i>
        </button>
    </div>

    <!-- Status Bar / Keymap Hints -->
    <div id="footer-hints" class="absolute bottom-2 right-4 z-20 text-[11px] text-slate-500 pointer-events-none hidden sm:block">
        Shortcuts: <kbd class="px-1 bg-slate-800 rounded">B</kbd> Pen | <kbd class="px-1 bg-slate-800 rounded">E</kbd> Eraser | <kbd class="px-1 bg-slate-800 rounded">F</kbd> Start Line | <kbd class="px-1 bg-slate-800 rounded">[ / ]</kbd> Size | <kbd class="px-1 bg-slate-800 rounded">Ctrl+Z</kbd> Undo
    </div>

    <!-- Confirmation Modal for Canvas Clearing -->
    <div id="confirm-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center">
            <div class="w-12 h-12 bg-red-950/50 border border-red-800/50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-triangle-exclamation text-xl"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-100 mb-2">Clear Track Canvas?</h3>
            <p class="text-xs text-slate-400 mb-6">This will wipe the current track and reset to a blank red canvas. You can undo this action.</p>
            <div class="flex gap-3">
                <button id="cancel-clear-btn" class="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold transition">Cancel</button>
                <button id="confirm-clear-btn" class="flex-1 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-sm font-semibold transition">Clear Track</button>
            </div>
        </div>
    </div>

    <!-- Application Logic Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Main Canvas References
            const canvas = document.getElementById('track-canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const gridCanvas = document.getElementById('grid-canvas');
            const gridCtx = gridCanvas.getContext('2d');
            const canvasWrapper = document.getElementById('canvas-wrapper');
            const brushPreview = document.getElementById('brush-preview');

            // Constants
            const CANVAS_WIDTH = 1000;
            const CANVAS_HEIGHT = 700;
            const RED_BACKGROUND = '#d32f2f'; // Configurable Track Canvas Red
            const WHITE_TRACK = '#ffffff';

            // State variables
            let currentTool = 'pen'; // 'pen', 'eraser', 'finish'
            let brushSize = 60;
            let smoothCurves = true;
            let isDrawing = false;
            let points = [];
            let startFinishLine = null; // { x, y, angle }

            // History Stack for Undo/Redo
            const historyStack = [];
            const redoStack = [];
            const MAX_HISTORY = 30;

            // Initialize App
            function init() {
                // Ensure dimensions
                canvas.width = CANVAS_WIDTH;
                canvas.height = CANVAS_HEIGHT;
                gridCanvas.width = CANVAS_WIDTH;
                gridCanvas.height = CANVAS_HEIGHT;

                // Fill default background
                fillBackground();
                drawGrid();
                saveState(); // Initial state

                // Event Listeners
                setupEventListeners();
                updateUIState();
            }

            // Fill canvas with default solid track red
            function fillBackground() {
                ctx.fillStyle = RED_BACKGROUND;
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            }

            // Draw subtle guide grid on grid canvas
            function drawGrid() {
                gridCtx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                gridCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                gridCtx.lineWidth = 1;

                const gridSize = 50;
                for (let x = 0; x <= CANVAS_WIDTH; x += gridSize) {
                    gridCtx.beginPath();
                    gridCtx.moveTo(x, 0);
                    gridCtx.lineTo(x, CANVAS_HEIGHT);
                    gridCtx.stroke();
                }
                for (let y = 0; y <= CANVAS_HEIGHT; y += gridSize) {
                    gridCtx.beginPath();
                    gridCtx.moveTo(0, y);
                    gridCtx.lineTo(CANVAS_WIDTH, y);
                    gridCtx.stroke();
                }
            }

            // Save state to Undo stack
            function saveState() {
                if (historyStack.length >= MAX_HISTORY) {
                    historyStack.shift();
                }
                historyStack.push({
                    imageData: ctx.getImageData(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT),
                    finishLine: startFinishLine ? { ...startFinishLine } : null
                });
                redoStack.length = 0; // Clear redo on new action
                updateHistoryButtons();
            }

            function updateHistoryButtons() {
                document.getElementById('undo-btn').disabled = historyStack.length <= 1;
                document.getElementById('redo-btn').disabled = redoStack.length === 0;
            }

            function undo() {
                if (historyStack.length > 1) {
                    const current = historyStack.pop();
                    redoStack.push(current);
                    const previous = historyStack[historyStack.length - 1];
                    ctx.putImageData(previous.imageData, 0, 0);
                    startFinishLine = previous.finishLine ? { ...previous.finishLine } : null;
                    redrawStartFinishLine();
                    updateHistoryButtons();
                }
            }

            function redo() {
                if (redoStack.length > 0) {
                    const next = redoStack.pop();
                    historyStack.push(next);
                    ctx.putImageData(next.imageData, 0, 0);
                    startFinishLine = next.finishLine ? { ...next.finishLine } : null;
                    redrawStartFinishLine();
                    updateHistoryButtons();
                }
            }

            // Drawing Helpers
            function getCanvasCoordinates(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = CANVAS_WIDTH / rect.width;
                const scaleY = CANVAS_HEIGHT / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            function startDrawing(e) {
                if (currentTool === 'finish') {
                    const coords = getCanvasCoordinates(e);
                    const angle = parseInt(document.getElementById('finish-angle').value);
                    startFinishLine = { x: coords.x, y: coords.y, angle: angle };
                    placeStartFinishLine(coords.x, coords.y, angle);
                    saveState();
                    return;
                }

                isDrawing = true;
                points = [];
                const coords = getCanvasCoordinates(e);
                points.push(coords);

                ctx.beginPath();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = brushSize;
                ctx.strokeStyle = (currentTool === 'pen') ? WHITE_TRACK : RED_BACKGROUND;

                ctx.arc(coords.x, coords.y, brushSize / 2, 0, Math.PI * 2);
                ctx.fillStyle = ctx.strokeStyle;
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(coords.x, coords.y);
            }

            function draw(e) {
                if (!isDrawing) return;
                const coords = getCanvasCoordinates(e);
                points.push(coords);

                ctx.strokeStyle = (currentTool === 'pen') ? WHITE_TRACK : RED_BACKGROUND;
                ctx.lineWidth = brushSize;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (smoothCurves && points.length > 2) {
                    // Quadratic curve smoothing
                    ctx.beginPath();
                    ctx.moveTo(points[0].x, points[0].y);
                    for (let i = 1; i < points.length - 1; i++) {
                        const xc = (points[i].x + points[i + 1].x) / 2;
                        const yc = (points[i].y + points[i + 1].y) / 2;
                        ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
                    }
                    ctx.stroke();
                } else {
                    ctx.lineTo(coords.x, coords.y);
                    ctx.stroke();
                }
            }

            function stopDrawing() {
                if (isDrawing) {
                    isDrawing = false;
                    points = [];
                    // Re-render finish line on top if it exists
                    if (startFinishLine) {
                        redrawStartFinishLine();
                    }
                    saveState();
                }
            }

            // Draw Checkered Start/Finish Line
            function placeStartFinishLine(x, y, angleDeg) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate((angleDeg * Math.PI) / 180);

                const width = Math.max(40, brushSize);
                const height = 16;
                const rows = 2;
                const cols = 8;
                const cellW = width / cols;
                const cellH = height / rows;

                // Border box
                ctx.fillStyle = '#000000';
                ctx.fillRect(-width / 2 - 2, -height / 2 - 2, width + 4, height + 4);

                // Checkers pattern
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        ctx.fillStyle = (r + c) % 2 === 0 ? '#ffffff' : '#000000';
                        ctx.fillRect(-width / 2 + c * cellW, -height / 2 + r * cellH, cellW, cellH);
                    }
                }

                // Direction Arrow
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.moveTo(0, -height / 2 - 6);
                ctx.lineTo(6, -height / 2 - 12);
                ctx.lineTo(-6, -height / 2 - 12);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            function redrawStartFinishLine() {
                if (startFinishLine) {
                    placeStartFinishLine(startFinishLine.x, startFinishLine.y, startFinishLine.angle);
                }
            }

            // Setup UI Event Listeners
            function setupEventListeners() {
                // Mouse & Touch Canvas Events
                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', (e) => {
                    draw(e);
                    updateBrushPreview(e);
                });
                window.addEventListener('mouseup', stopDrawing);

                canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    startDrawing(e);
                }, { passive: false });
                canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    draw(e);
                }, { passive: false });
                window.addEventListener('touchend', stopDrawing);

                // Brush preview circle movement
                canvas.addEventListener('mouseenter', () => {
                    if (currentTool !== 'finish') brushPreview.style.display = 'block';
                });
                canvas.addEventListener('mouseleave', () => {
                    brushPreview.style.display = 'none';
                });

                // Tool selection
                document.getElementById('tool-pen').addEventListener('click', () => setTool('pen'));
                document.getElementById('tool-eraser').addEventListener('click', () => setTool('eraser'));
                document.getElementById('tool-finish').addEventListener('click', () => setTool('finish'));

                // Size slider
                const sizeSlider = document.getElementById('brush-size');
                sizeSlider.addEventListener('input', (e) => {
                    brushSize = parseInt(e.target.value);
                    document.getElementById('brush-size-val').textContent = `${brushSize}px`;
                    updateBrushPreview();
                });

                // Angle slider
                const angleSlider = document.getElementById('finish-angle');
                angleSlider.addEventListener('input', (e) => {
                    const angle = e.target.value;
                    document.getElementById('finish-angle-val').textContent = `${angle}°`;
                    if (startFinishLine) {
                        // Re-render latest state with new angle
                        if (historyStack.length > 0) {
                            ctx.putImageData(historyStack[historyStack.length - 1].imageData, 0, 0);
                        }
                        startFinishLine.angle = parseInt(angle);
                        placeStartFinishLine(startFinishLine.x, startFinishLine.y, startFinishLine.angle);
                    }
                });

                // Smooth curve checkbox
                document.getElementById('smooth-toggle').addEventListener('change', (e) => {
                    smoothCurves = e.target.checked;
                });

                // Top bar action buttons
                document.getElementById('undo-btn').addEventListener('click', undo);
                document.getElementById('redo-btn').addEventListener('click', redo);

                // Grid Toggle
                document.getElementById('toggle-grid').addEventListener('click', () => {
                    gridCanvas.classList.toggle('hidden');
                    document.getElementById('toggle-grid').classList.toggle('bg-red-950/50');
                });

                // Clear Modal
                const confirmModal = document.getElementById('confirm-modal');
                document.getElementById('clear-btn').addEventListener('click', () => {
                    confirmModal.classList.remove('hidden');
                });
                document.getElementById('cancel-clear-btn').addEventListener('click', () => {
                    confirmModal.classList.add('hidden');
                });
                document.getElementById('confirm-clear-btn').addEventListener('click', () => {
                    fillBackground();
                    startFinishLine = null;
                    saveState();
                    confirmModal.classList.add('hidden');
                });

                // Export PNG
                document.getElementById('export-png-btn').addEventListener('click', exportPNG);

                // Export JSON Metadata
                document.getElementById('export-json-btn').addEventListener('click', exportJSON);

                // Import Image File
                document.getElementById('import-file').addEventListener('change', handleImport);

                // Minimizable UI Toggle
                document.getElementById('toggle-ui-btn').addEventListener('click', () => {
                    document.getElementById('toolbar').classList.toggle('opacity-20');
                    document.getElementById('toolbar').classList.toggle('hover:opacity-100');
                });

                // Global Keyboard Shortcuts
                window.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'INPUT') return; // Ignore if focused on inputs

                    if (e.key.toLowerCase() === 'b') setTool('pen');
                    if (e.key.toLowerCase() === 'e') setTool('eraser');
                    if (e.key.toLowerCase() === 'f') setTool('finish');
                    if (e.key.toLowerCase() === 'g') document.getElementById('toggle-grid').click();

                    if (e.key === '[') {
                        brushSize = Math.max(5, brushSize - 5);
                        sizeSlider.value = brushSize;
                        document.getElementById('brush-size-val').textContent = `${brushSize}px`;
                        updateBrushPreview();
                    }
                    if (e.key === ']') {
                        brushSize = Math.min(150, brushSize + 5);
                        sizeSlider.value = brushSize;
                        document.getElementById('brush-size-val').textContent = `${brushSize}px`;
                        updateBrushPreview();
                    }

                    if (e.ctrlKey || e.metaKey) {
                        if (e.key.toLowerCase() === 'z') {
                            e.preventDefault();
                            if (e.shiftKey) redo(); else undo();
                        }
                        if (e.key.toLowerCase() === 'y') {
                            e.preventDefault();
                            redo();
                        }
                    }
                });
            }

            function setTool(tool) {
                currentTool = tool;
                document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
                
                if (tool === 'pen') document.getElementById('tool-pen').classList.add('active');
                if (tool === 'eraser') document.getElementById('tool-eraser').classList.add('active');
                if (tool === 'finish') document.getElementById('tool-finish').classList.add('active');

                updateUIState();
            }

            function updateUIState() {
                const brushControls = document.getElementById('brush-controls');
                const finishControls = document.getElementById('finish-controls');

                if (currentTool === 'finish') {
                    brushControls.classList.add('hidden');
                    finishControls.classList.remove('hidden');
                    brushPreview.style.display = 'none';
                } else {
                    brushControls.classList.remove('hidden');
                    finishControls.classList.add('hidden');
                }
            }

            function updateBrushPreview(e) {
                if (currentTool === 'finish') return;
                
                if (e) {
                    const rect = canvas.getBoundingClientRect();
                    brushPreview.style.left = `${e.clientX}px`;
                    brushPreview.style.top = `${e.clientY}px`;
                }

                const rect = canvas.getBoundingClientRect();
                const scale = rect.width / CANVAS_WIDTH;
                const displaySize = brushSize * scale;

                brushPreview.style.width = `${displaySize}px`;
                brushPreview.style.height = `${displaySize}px`;
                brushPreview.style.borderColor = currentTool === 'pen' ? '#ffffff' : '#d32f2f';
            }

            // File Export Functions
            function exportPNG() {
                const link = document.createElement('a');
                link.download = 'race_track.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }

            function exportJSON() {
                const metadata = {
                    version: "1.0",
                    width: CANVAS_WIDTH,
                    height: CANVAS_HEIGHT,
                    backgroundColor: RED_BACKGROUND,
                    trackColor: WHITE_TRACK,
                    startFinishLine: startFinishLine || null,
                    exportedAt: new Date().toISOString()
                };

                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(metadata, null, 2));
                const link = document.createElement('a');
                link.download = 'race_track_meta.json';
                link.href = dataStr;
                link.click();
            }

            // Image Import Handler
            function handleImport(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        fillBackground();
                        ctx.drawImage(img, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                        saveState();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }

            // Run setup
            init();
        });
    </script>
</body>
</html>
