<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500&display=swap">
<title>realjoshai</title>
<style>
:root{--ac:#ffd84a;--ac2:#ffd84a;--bg:#f3f4f6;--sb:#e8eaee;--card:#ffffff;--fg:#14161c;--mut:#666b78;--bd:#d3d7df;--hov:#14161c0e;--on:#14161c;--sh:0 8px 24px -10px rgba(20,22,28,.4);--code:#14161c}
:root[data-t=dark]{--bg:#0f1a2b;--sb:#0a121f;--card:#17263d;--fg:#eef1f6;--mut:#8f9cb4;--bd:#27374f;--hov:#ffffff12;--sh:0 8px 24px -10px rgba(0,0,0,.7);--code:#08101c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.65 Inter,"SF Pro Text",system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg);display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
i[data-i]{display:inline-flex;flex:none}
input,textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;width:100%;outline:none;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}
/* sidebar */
aside{width:296px;flex:none;background:var(--sb);backdrop-filter:blur(20px);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:14px 12px;gap:10px;transition:width .3s cubic-bezier(.4,0,.2,1),transform .3s cubic-bezier(.4,0,.2,1);overflow:hidden;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 6px 16px -4px var(--ac)}
.brand .gap{flex:1}
.ib{width:36px;height:36px;border-radius:10px;justify-content:center;color:var(--mut);transition:.15s}
.ib:hover{background:var(--hov);color:var(--fg)}
.nb{padding:11px 14px;border-radius:13px;font-weight:600;white-space:nowrap}
.nb.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 8px 20px -8px var(--ac);transition:.2s}
.nb.pri:hover{transform:translateY(-1px);filter:brightness(1.08)}
.nb.ghost{color:var(--mut);font-weight:500}.nb.ghost:hover{background:var(--hov);color:var(--fg)}
.sr{position:relative}.sr i{position:absolute;left:11px;top:11px;color:var(--mut)}.sr input{padding-left:36px;border-radius:12px;background:var(--hov)}
#list{flex:1;overflow:auto;margin:0 -4px;padding:0 4px}
.gh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:14px 10px 4px;font-weight:600}
.it{display:flex;align-items:center;gap:4px;padding:8px 10px;border-radius:11px;cursor:pointer;color:var(--mut);transition:.12s}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it:hover{background:var(--hov);color:var(--fg)}
.it.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--fg);font-weight:500}
.it .x{opacity:0;width:26px;height:26px;border-radius:8px;justify-content:center;color:var(--mut)}.it:hover .x{opacity:1}.it .x:hover{color:#ef4444;background:var(--hov)}
body.col aside{width:68px}
body.col .lbl,body.col #list,body.col .sr,body.col .name,body.col .logo,body.col .brand .gap{display:none}
body.col .nb{justify-content:center;padding:11px}body.col .brand{justify-content:center}
.scrim{display:none}
/* main */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
main::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(700px 420px at 85% -10%,color-mix(in srgb,var(--ac) 16%,transparent),transparent),radial-gradient(600px 420px at -5% 105%,color-mix(in srgb,var(--ac2) 13%,transparent),transparent)}
main>*{position:relative}
header{display:flex;align-items:center;gap:6px;padding:10px 16px;backdrop-filter:blur(14px)}
#tg{display:none}
header h1{font-size:15px;font-weight:600;margin:0 8px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pill{font-size:12px;color:var(--mut);border:1px solid var(--bd);background:var(--card);padding:4px 11px;border-radius:99px;white-space:nowrap}
#msgs{flex:1;overflow:auto}
.w{max-width:800px;margin:0 auto;padding:12px 20px 30px}
.m{display:flex;gap:14px;margin-bottom:26px;animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.av{width:32px;height:32px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 14px -5px var(--ac)}
.bd{flex:1;min-width:0}
.m.user{justify-content:flex-end}.m.user .bd{flex:none;max-width:82%;display:flex;flex-direction:column;align-items:flex-end}
.m.user .bub{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:10px 16px;border-radius:20px 20px 6px 20px;white-space:pre-wrap;word-break:break-word;box-shadow:0 8px 20px -10px var(--ac)}
.bub>:last-child{margin-bottom:0}
.bub p{margin:0 0 .8em}.bub h1,.bub h2,.bub h3,.bub h4{margin:1.1em 0 .4em;line-height:1.3;letter-spacing:-.01em}
.bub ul,.bub ol{padding-left:1.4em;margin:0 0 .8em}.bub li{margin:.2em 0}.bub a{color:var(--ac)}
.bub hr{border:0;border-top:1px solid var(--bd);margin:1em 0}
.bub blockquote{margin:0 0 .8em;padding:2px 14px;border-left:3px solid var(--ac);color:var(--mut)}
.bub code{background:var(--hov);border:1px solid var(--bd);padding:1px 6px;border-radius:6px;font:13px ui-monospace,Menlo,monospace}
.code{background:var(--code);border-radius:14px;margin:.8em 0;overflow:hidden;border:1px solid #ffffff14}
.ch{display:flex;justify-content:space-between;padding:7px 14px;font-size:12px;color:#9a9aad;background:#ffffff0d}
.ch button{color:#c9c9d8}.ch button:hover{color:#fff}
.code pre{margin:0;padding:14px;overflow:auto;color:#e8e8f2}.code code{background:none;border:0;padding:0;color:inherit}
.act{display:flex;gap:2px;margin-top:6px;opacity:0;transition:.15s}.m:hover .act,.m:last-child .act{opacity:1}
.act button{font-size:12px;color:var(--mut);padding:4px 9px;border-radius:8px}.act button:hover{background:var(--hov);color:var(--fg)}
.cur{display:inline-block;width:8px;height:16px;background:var(--ac);border-radius:3px;vertical-align:-3px;margin-left:2px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.15}}
.dots{display:inline-flex;gap:5px;padding:10px 0}.dots i{width:8px;height:8px;border-radius:50%;background:var(--ac);animation:dt 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
/* hero */
.hero{text-align:center;padding:11vh 0 10px}
.hero .logo{width:60px;height:60px;border-radius:20px;margin:0 auto 22px;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.hero h2{font-size:clamp(28px,5vw,40px);letter-spacing:-.03em;line-height:1.15;margin:0 0 10px;font-weight:700}
.hero h2 span{background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:0 0 34px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;text-align:left}
.chip{flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border:1px solid var(--bd);border-radius:18px;background:var(--card);backdrop-filter:blur(10px);transition:.2s;font-size:14px}
.chip:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:var(--sh)}
.chip i{color:var(--ac)}.chip b{font-weight:600}.chip small{color:var(--mut);font-size:13px;line-height:1.4}
/* composer */
.comp{padding:0 16px calc(14px + env(safe-area-inset-bottom,0px))}
.box{max-width:800px;margin:0 auto;border:1px solid var(--bd);border-radius:24px;background:var(--card);backdrop-filter:blur(18px);padding:8px;display:flex;gap:8px;align-items:flex-end;box-shadow:var(--sh);transition:.2s}
.box:focus-within{border-color:var(--ac);box-shadow:var(--sh),0 0 0 4px color-mix(in srgb,var(--ac) 14%,transparent)}
.box textarea{border:0;background:none;resize:none;max-height:200px;padding:9px 0;box-shadow:none!important;border-radius:0}
#go{width:42px;height:42px;border-radius:50%;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));flex:none;transition:.2s;box-shadow:0 6px 16px -6px var(--ac)}
#go:hover:not(:disabled){transform:scale(1.08)}#go:disabled{opacity:.35;box-shadow:none;cursor:default}
.hint{text-align:center;font-size:12px;color:var(--mut);margin-top:8px}
#dn{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;justify-content:center;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:.2s}
#dn.on{opacity:1;pointer-events:auto}
/* dialog */
dialog{border:1px solid var(--bd);border-radius:24px;background:var(--bg);color:var(--fg);width:min(500px,92vw);padding:24px;box-shadow:var(--sh);max-height:90vh}
dialog::backdrop{background:#0007;backdrop-filter:blur(5px)}
dialog h3{margin:0 0 4px;font-size:20px}
dialog label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 5px}
.row{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.sw{display:flex;gap:10px}.sw button{width:30px;height:30px;border-radius:50%;border:3px solid var(--bg);outline:2px solid transparent;justify-content:center}
.sw button.on{outline-color:var(--fg)}
.sb2{padding:9px 14px;border-radius:12px;border:1px solid var(--bd);font-size:14px}.sb2:hover{border-color:var(--ac)}
#toast{position:fixed;bottom:100px;left:50%;transform:translate(-50%,10px);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:50;font-size:14px}
#toast.on{opacity:1;transform:translate(-50%,0)}
.box{position:relative}.box .ib{height:42px}
.tools{max-width:800px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}#pend{display:contents}
.tp{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;border:1px solid var(--bd);font-size:13px;color:var(--mut);background:var(--card);backdrop-filter:blur(10px);transition:.15s;width:auto}
.tp:hover{border-color:var(--ac);color:var(--fg)}.tp.on{color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
select.tp{appearance:none;cursor:pointer}#pend .tp button{padding:0;color:inherit}
#sl{display:none;position:absolute;bottom:calc(100% + 10px);left:0;right:0;background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:6px;max-height:300px;overflow:auto;z-index:30}
.sl-i{width:100%;justify-content:flex-start;gap:12px;padding:9px 12px;border-radius:12px;text-align:left}.sl-i b{color:var(--ac);min-width:84px}.sl-i small{color:var(--mut);font-size:13px}.sl-i.on,.sl-i:hover{background:var(--hov)}
details.th{margin:0 0 .9em;border:1px solid var(--bd);border-radius:14px;background:var(--hov);padding:10px 14px;font-size:13.5px;color:var(--mut)}
details.th summary{cursor:pointer;font-weight:600;color:var(--fg)}details.th[open] summary{margin-bottom:8px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.m.user .srcs{justify-content:flex-end}
.srcs a{font-size:12px;border:1px solid var(--bd);border-radius:99px;padding:3px 11px;color:var(--mut);text-decoration:none;background:var(--card)}.srcs a:hover{border-color:var(--ac);color:var(--ac)}
@media(max-width:800px){
 aside{position:fixed;left:0;top:0;bottom:0;width:300px!important;transform:translateX(-100%)}
 body.open aside{transform:none;box-shadow:var(--sh)}
 body.col .lbl,body.col #list,body.col .sr,body.col .name,body.col .logo,body.col .brand .gap{display:revert}
 body.col .lbl{display:inline}
 .scrim{display:block;position:fixed;inset:0;background:#0006;z-index:15;opacity:0;pointer-events:none;transition:.3s}body.open .scrim{opacity:1;pointer-events:auto}
 #tg{display:inline-flex}.w{padding:8px 14px 24px}
}
body.col #tg{display:inline-flex}

/* ---- Marker theme: ink + highlighter, flat surfaces, one hard-shadow moment ---- */
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15.5px}
.bub code,.code code{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
::selection{background:var(--ac);color:var(--on)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
input:focus,textarea:focus,select:focus{border-color:var(--fg);box-shadow:3px 3px 0 var(--ac)}
aside{backdrop-filter:none;background:var(--sb)}main::before{display:none}header{backdrop-filter:none}
.logo,.av{background:var(--fg);color:var(--ac);box-shadow:none;border-radius:8px}
.nb{border-radius:10px}
.nb.pri{background:var(--fg);color:var(--bg);box-shadow:3px 3px 0 var(--ac);filter:none}
.nb.pri:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ac);filter:none}
.sr input{border-radius:10px;background:var(--card)}
.gh{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:700;color:var(--fg)}
.it{border-radius:8px}.it.on{background:var(--ac);color:var(--on);font-weight:600}.it.on .x{color:var(--on)}
.pill{border-radius:6px;background:transparent}
.m.user .bub{background:var(--fg);color:var(--bg);box-shadow:none;border-radius:14px 14px 4px 14px}
.bub a{color:var(--fg);text-decoration:none;background:linear-gradient(transparent 58%,var(--ac) 58%)}
.bub blockquote{border-left:4px solid var(--ac)}
.bub code{border-radius:5px;background:var(--hov)}
.code{border-radius:8px}
.cur,.dots i{background:var(--fg)}
.act button{border-radius:6px}
.hero{text-align:left;padding:9vh 0 10px}
.hero h2{font-size:clamp(36px,6.4vw,64px);line-height:1.02;letter-spacing:-.04em;margin:0 0 16px}
.hero p{margin:0 0 34px;font-size:16px}
.chips{display:block;border-top:2px solid var(--fg)}
.chip{width:100%;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 20px;padding:15px 6px;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:none;backdrop-filter:none;font-size:17px;text-align:left}
.chip span{color:var(--mut);font-size:14px}
.chip:hover{transform:none;box-shadow:none;background:var(--ac);color:var(--on);border-color:var(--fg)}.chip:hover span{color:var(--on)}
.box{border:2px solid var(--fg);border-radius:14px;background:var(--card);backdrop-filter:none;box-shadow:5px 5px 0 var(--ac)}
.box:focus-within{border-color:var(--fg);box-shadow:7px 7px 0 var(--ac)}
#go{background:var(--fg);color:var(--ac);border-radius:10px;box-shadow:none}#go:hover:not(:disabled){transform:translate(-1px,-1px)}
.tp{border-radius:8px;backdrop-filter:none;background:var(--card)}.tp:hover{border-color:var(--fg)}
.tp.on{background:var(--ac);color:var(--on);border-color:var(--fg);font-weight:600}
#sl{backdrop-filter:none;background:var(--card);border:2px solid var(--fg);border-radius:12px;box-shadow:4px 4px 0 var(--ac)}
.sl-i{border-radius:8px}.sl-i b{color:inherit}.sl-i.on,.sl-i:hover{background:var(--ac);color:var(--on)}.sl-i.on small,.sl-i:hover small{color:var(--on)}
details.th{background:var(--card);border-radius:8px;border-left:4px solid var(--ac)}
.srcs a{border-radius:6px;backdrop-filter:none}.srcs a:hover{border-color:var(--fg);color:var(--fg);background:var(--ac)}
dialog{border:2px solid var(--fg);border-radius:14px;box-shadow:8px 8px 0 var(--ac)}
.sw button{border:2px solid var(--fg);border-radius:8px}.sw button.on{outline-color:var(--ac);outline-width:3px}
.sb2{border-radius:8px}.sb2:hover{border-color:var(--fg)}
#dn{border-radius:10px;backdrop-filter:none}#toast{border-radius:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.brand .name{font-weight:800;letter-spacing:-.03em;color:var(--on);padding:0 4px;background:linear-gradient(var(--ac),var(--ac)) 0 88%/100% .42em no-repeat}
.hero h2 span{background:linear-gradient(var(--ac),var(--ac)) 0 92%/0% .34em no-repeat;animation:swipe .9s .2s cubic-bezier(.6,0,.2,1) forwards;-webkit-box-decoration-break:clone;box-decoration-break:clone}
@keyframes swipe{to{background-size:100% .34em}}
.tc{color:#7c859a;font-style:italic}.ts{color:var(--ac)}.tk{color:#85c8ff}.tn{color:#8be9b4}
.tw{overflow:auto;margin:.8em 0}.tw table{border-collapse:collapse;font-size:14px;width:100%}.tw th,.tw td{border-bottom:1px solid var(--bd);padding:8px 14px 8px 0;text-align:left;vertical-align:top}.tw th{border-bottom:2px solid var(--fg);font-weight:700}
.thumb{height:30px;width:30px;object-fit:cover;border-radius:5px}.thumb.big{height:120px;width:auto;max-width:220px;border-radius:8px;border:1px solid var(--bd)}
mark{background:var(--ac);color:var(--on);padding:0 3px;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#hlb{position:fixed;display:none;z-index:40;background:var(--ac);color:var(--on);border:2px solid var(--fg);border-radius:8px;padding:4px 12px;font-weight:700;font-size:13px;box-shadow:3px 3px 0 var(--fg);cursor:pointer}
#hlist{max-height:55vh;overflow:auto}.hli{padding:14px 0;border-bottom:1px solid var(--bd)}.hli small{display:block;color:var(--mut);margin:8px 0 4px}.hli button{font-size:12px;color:var(--mut);margin-right:12px;text-decoration:underline}.hli button:hover{color:var(--fg)}
#hls b{font-weight:700;background:var(--fg);color:var(--bg);border-radius:6px;padding:0 6px;font-size:12px}#hls b:empty{display:none}
@media(prefers-reduced-motion:reduce){.hero h2 span{background-size:100% .34em}}

/* ---- generating status ---- */
.status{display:inline-flex;align-items:center;gap:12px;padding:8px 0;font-size:15px}
.stx,summary.live{background:linear-gradient(90deg,var(--mut) 0,var(--mut) 40%,var(--fg) 50%,var(--mut) 60%,var(--mut) 100%) 100% 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600;animation:shim 1.7s linear infinite}
@keyframes shim{to{background-position:0 0}}
.eq{display:inline-flex;align-items:center;gap:3px;height:18px}
.eq i{width:4px;height:18px;border-radius:2px;background:var(--fg);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){background:var(--ac);box-shadow:0 0 0 1.5px var(--fg);animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.el{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}.stopped{color:var(--mut);font-style:italic}
main::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--ac) 40%,var(--fg) 60%,transparent) -40% 0/40% 100% no-repeat;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
body.busy main::after{opacity:1;animation:slide 1.3s linear infinite}
@keyframes slide{to{background-position:140% 0}}
.cur{animation:bl .9s steps(2) infinite}
body.busy .m:last-child .act{display:none}
</style>
</head>
<body>
<aside id="sb">
  <div class="brand">
    <div class="logo"><i data-i="spark"></i></div>
    <span class="name">realjoshai</span>
    <span class="gap"></span>
    <button class="ib" id="tg2" title="Zijbalk inklappen"><i data-i="panel"></i></button>
  </div>
  <button class="nb pri" id="new" title="Nieuwe chat (Ctrl+K)"><i data-i="plus"></i><span class="lbl">Nieuwe chat</span></button>
  <div class="sr"><i data-i="search"></i><input id="q" placeholder="Zoek chats"></div>
  <div id="list"></div>
  <button class="nb ghost" id="hls" title="Opgeslagen hoogtepunten"><i data-i="mark"></i><span class="lbl">Hoogtepunten <b id="hc"></b></span></button>
  <button class="nb ghost" id="set" title="Instellingen"><i data-i="sliders"></i><span class="lbl">Instellingen</span></button>
</aside>
<div class="scrim" id="scrim"></div>
<main>
  <header>
    <button class="ib" id="tg" title="Zijbalk openen"><i data-i="panel"></i></button>
    <h1 id="title">Nieuwe chat</h1>
    <span class="pill" id="pill"></span>
    <button class="ib" id="th" title="Thema wisselen"></button>
    <button class="ib" id="ex" title="Chat exporteren"><i data-i="dl"></i></button>
  </header>
  <div id="msgs"><div class="w" id="w"></div></div>
  <button id="dn" title="Naar beneden"><i data-i="down"></i></button>
  <div class="comp">
    <div class="tools">
      <button class="tp" id="t-think" title="Eerst nadenken (/think)"><i data-i="brain"></i>Denk</button>
      <button class="tp" id="t-search" title="Zoeken op het web (/search)"><i data-i="globe"></i>Zoek op</button>
      <select class="tp" id="persona" title="Persona"></select>
      <span id="pend"></span>
    </div>
    <div class="box">
      <div id="sl"></div>
      <button class="ib" id="at" title="Bestand of afbeelding toevoegen"><i data-i="clip"></i></button>
      <button class="ib" id="mic" title="Spraak"><i data-i="mic"></i></button>
      <input type="file" id="fl" accept="image/*,text/*,.md,.csv,.json,.js,.py,.log,.html,.css,.xml,.yml" multiple hidden>
      <textarea id="in" rows="1" placeholder="Vraag alles… of typ / voor commando's"></textarea>
      <button id="go" title="Versturen"></button>
    </div>
    <div class="hint">AI kan fouten maken. Check belangrijke informatie.</div>
  </div>
</main>

<dialog id="dlg">
  <h3>Instellingen</h3>
  <label>Creativiteit (temperatuur): <span id="tv"></span></label><input id="s-temp" type="range" min="0" max="2" step="0.1">
  <label>Thema</label><select id="s-theme"><option value="auto">Systeem</option><option value="light">Licht</option><option value="dark">Donker</option></select>
  <label>Accentkleur</label><div class="sw" id="sw"></div>
  <div class="row">
    <button class="sb2" id="bex">Exporteer alles</button>
    <button class="sb2" id="bim">Importeer</button>
    <button class="sb2" id="bcl" style="color:#ef4444">Verwijder alles</button>
    <button class="sb2" id="bok" style="margin-left:auto;background:var(--ac);color:var(--on);border:2px solid var(--fg);font-weight:700">Opslaan</button>
  </div>
  <input type="file" id="file" accept=".json" hidden>
</dialog>
<dialog id="hdlg">
  <h3>Hoogtepunten</h3>
  <div id="hlist"></div>
  <div class="row">
    <button class="sb2" id="hex">Exporteer als Markdown</button>
    <button class="sb2" id="hcl" style="color:#ef4444">Alles wissen</button>
    <button class="sb2" id="hx" style="margin-left:auto">Sluiten</button>
  </div>
</dialog>
<button id="hlb">Hoogtepunt</button>
<div id="toast"></div>

<script>
// margin - single-file chat UI
// Sections: markdown, chats & rendering, sending & streaming, API layer, slash commands,
// syntax highlighting, highlights, UI wiring. To plug in your own backend, edit the
// "API LAYER" section (streamReply) - nothing else needs to change.
// ---------------------------------------------------------------------------
// CONFIG
// ---------------------------------------------------------------------------
const GEMINI_API_KEY = "api_key_placeholder";
const GEMINI_MODEL = 'gemini-2.5-flash';
const SYSTEM_PROMPT = `Praat als iemand van Gen Z of Gen Alpha: gebruik korte zinnen met opzettelijke grammaticale fouten, vermijd leestekens zoals gedachtestreepjes en houd je niet aan de correcte grammatica. Gebruik geen emoji's midden in een zin; voeg ze slechts af en toe toe – zeker niet in elke zin. Gebruik termen als 'twin', 'ts' en 'bro' met mate, maar wel regelmatig. Als er een verwarrende vraag wordt gesteld, reageer dan bijvoorbeeld met: "shit twin idk fr" of iets dergelijks. Houd je zinnen kort (maximaal één of twee regels) en laat geen witregels tussen de zinnen. Kijk goed naar mijn schrijfstijl en neem die over. Houd het gesprek kort, direct en bot; gebruik geen leestekens. Gebruik 'twin' en 'bro' af en toe, maar niet te vaak. Bij lastige vragen zeg je: "idk bro 🫩✌️💔". Gebruik niet te veel emoji's en vermijd de 😎-emoji; kies liever voor 😭, ✌️, 🫩 of 🥀, maar ook weer niet in elke zin. Laat het personage wat dommig overkomen bij vragen – antwoord bij moeilijke vragen met "idk bro ✌️🫩🥀💔". Als ik een gesprek begin met een begroeting zonder direct een vraag te stellen of iets te zeggen, reageer dan met: "wat wil je 🫩✌️🥀💔". Wees een beetje bot en gebruik absoluut geen 👍-emoji. Gebruik bij lastige vragen steeds "idk bro ✌️🫩🥀💔" en gebruik aan het begin van een gesprek geen andere woorden.`;

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ld = (k, d) => {
  try {
    return JSON.parse(localStorage.getItem(k)) || d;
  } catch {
    return d;
  }
};
// Line icons (24x24 SVG path data)
const P = {
  mark: '<path d="M9 11l-5 5v4h4l5-5M9 11l6-6 4 4-6 6M9 11l4 4"/>',
  vol: '<path d="M11 5L6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
  mic: '<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  clip: '<path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  brain: '<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 3 5 3 3 0 0 0 5 1V4a3 3 0 0 0-3 0zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-3 5 3 3 0 0 1-5 1V4a3 3 0 0 1 3 0z"/>',
  pin: '<path d="M12 17v5M8 3h8l-1 7 3 3H6l3-3z"/>',
  spark: '<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>',
  panel: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  sliders: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  moon: '<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  send: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
  edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  redo: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  dl: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  map: '<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  book: '<path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  pot: '<path d="M5 11h14v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3zM3 11h18M9 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/>',
};
const ic = (n, s = 18) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const icons = () => document.querySelectorAll('i[data-i]').forEach(e => e.innerHTML = ic(e.dataset.i, e.closest('.logo') ? 16 : 18));
const AC = [['#ffd84a', '#ffd84a'], ['#ff9ec4', '#ff9ec4'], ['#8be9b4', '#8be9b4'], ['#85c8ff', '#85c8ff'], ['#ffab6b', '#ffab6b']];
let S = Object.assign({ temp: 0.7, theme: 'auto', ac: 0, col: false, persona: 'Standaard' }, ld('cfg', {}));
let chats = ld('chats', []), cur = null, ctrl = null, busy = false, mode = { think: false, search: false }, pend = [];
const save = () => {
  try {
    localStorage.setItem('chats', JSON.stringify(chats));
    localStorage.setItem('cfg', JSON.stringify(S));
  } catch { }
};
const chat = () => chats.find(c => c.id === cur);
const toast = t => {
  const e = $('#toast');
  e.textContent = t;
  e.classList.add('on');
  setTimeout(() => e.classList.remove('on'), 1600);
};
// Demo mode while no real key is set. Deliberately avoids repeating the placeholder text,
// so a build step that swaps the placeholder everywhere can't break this check.
const demo = () => !GEMINI_API_KEY || GEMINI_API_KEY.startsWith('api_key_');
// ===========================================================================
// MARKDOWN
// ===========================================================================

function inl(t) {
  return t.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|\W)\*(?!\s)(.+?)\*/g, '$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function md(s) {
  const bl = [];
  s = s.replace(/<think>([\s\S]*?)(<\/think>|$)/g, (m, t, e) => {
    bl.push(`<details class="th"${e ? '' : ' open'}><summary class="${e ? '' : 'live'}">${e ? 'Denkproces' : 'Nadenken…'}</summary>${md(t.trim())}</details>`);
    return `\n\0${bl.length - 1}\0\n`;
  });
  s = s.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g, (m, l, c) => {
    bl.push(`<div class="code"><div class="ch"><span>${l || 'text'}</span><button data-copy>Kopieer</button></div>${hl(c, l)}</div>`);
    return `\0${bl.length - 1}\0`;
  });
  s = s.replace(/^(\|.+\|[ \t]*\n)(\|[ \t:|-]+\|[ \t]*\n)((?:\|.*\|[ \t]*(?:\n|$))*)/gm, (m, h, _, b) => {
    const row = (r, t) => '<tr>' + r.trim().slice(1, -1).split('|').map(c => `<${t}>${inl(esc(c.trim()))}</${t}>`).join('') + '</tr>';
    bl.push(`<div class="tw"><table>${row(h, 'th')}${b.trim() ? b.trim().split('\n').map(r => row(r, 'td')).join('') : ''}</table></div>`);
    return `\n\0${bl.length - 1}\0\n`;
  });
  const out = [];
  let list = null;
  const close = () => {
    if (list) {
      out.push(`</${list}>`);
      list = null;
    }
  };
  const open = t => {
    if (list !== t) {
      close();
      out.push(`<${t}>`);
      list = t;
    }
  };
  for (const raw of esc(s).split('\n')) {
    let m;
    if (/^\0\d+\0$/.test(raw)) {
      close();
      out.push(raw);
    } else if (m = raw.match(/^(#{1,4})\s+(.*)/)) {
      close();
      out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`);
    } else if (/^---+$/.test(raw)) {
      close();
      out.push('<hr>');
    } else if (m = raw.match(/^\s*[-*]\s+(.*)/)) {
      open('ul');
      out.push(`<li>${inl(m[1])}</li>`);
    } else if (m = raw.match(/^\s*\d+\.\s+(.*)/)) {
      open('ol');
      out.push(`<li>${inl(m[1])}</li>`);
    } else if (m = raw.match(/^&gt;\s?(.*)/)) {
      close();
      out.push(`<blockquote>${inl(m[1])}</blockquote>`);
    } else if (!raw.trim())
      close();
    else {
      close();
      out.push(`<p>${inl(raw)}</p>`);
    }
  }
  close();
  return out.join('').replace(/\0(\d+)\0/g, (_, i) => bl[i]);
}
// ===========================================================================
// CHATS & RENDERING
// ===========================================================================

function newChat() {
  const c = chat();
  if (c && !c.msgs.length) {
    $('#in').focus();
    return;
  }
  const n = { id: Date.now().toString(36), title: 'Nieuwe chat', msgs: [], ts: Date.now() };
  chats.unshift(n);
  cur = n.id;
  save();
  renderAll();
  $('#in').focus();
  if (innerWidth <= 800) document.body.classList.remove('open');
}

function newChatForce() {
  chats = [];
  cur = null;
  newChat();
}

function renderList() {
  const f = $('#q').value.toLowerCase(), t0 = new Date().setHours(0, 0, 0, 0), D = 864e5;
  let last = '', h = '';
  [...chats].sort((a, b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || b.ts - a.ts).filter(c => !f || c.title.toLowerCase().includes(f) || c.msgs.some(m => m.content.toLowerCase().includes(f))).forEach(c => {
    const g = c.pin ? 'Vastgepind' : c.ts >= t0 ? 'Vandaag' : c.ts >= t0 - D ? 'Gisteren' : c.ts >= t0 - 6 * D ? 'Vorige 7 dagen' : 'Eerder';
    if (g !== last) {
      h += `<div class="gh">${g}</div>`;
      last = g;
    }
    h += `<div class="it ${c.id === cur ? 'on' : ''}" data-id="${c.id}"><span>${esc(c.title)}</span><button class="x" data-pin title="Vastzetten">${ic('pin', 15)}</button><button class="x" data-del title="Verwijderen">${ic('trash', 15)}</button></div>`;
  });
  $('#list').innerHTML = h || '<div class="gh">Geen chats gevonden</div>';
}

function msgHTML(m, i, last) {
  const u = m.role === 'user';
  return `<div class="m ${m.role}" data-i="${i}">${u ? '' : `<div class="av">${ic('spark', 16)}</div>`}<div class="bd">${m.src?.length ? `<div class="srcs">${m.src.map((x, k) => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${k + 1} · ${esc(x.title)}</a>`).join('')}</div>` : ''}${m.att?.length ? `<div class="srcs">${m.att.map(f => f.img ? `<img class="thumb big" src="${f.img}">` : `<span class="tp">${esc(f.name)}</span>`).join('')}</div>` : ''}<div class="bub">${u ? esc(m.content) : assistantBody(m, last)}</div>
  <div class="act"><button data-a="copy">${ic('copy', 14)}Kopieer</button>${u ? '' : `<button data-a="speak">${ic('vol', 14)}Voorlezen</button>`}${u ? `<button data-a="edit">${ic('edit', 14)}Bewerk</button>` : ''}${!u && last && !m.local ? `<button data-a="regen">${ic('redo', 14)}Opnieuw</button>` : ''}</div></div></div>`;
}

function renderMsgs() {
  const c = chat(), w = $('#w');
  if (!c.msgs.length) {
    const h = new Date().getHours(), g = h < 5 ? 'Hallo, nachtuil' : h < 12 ? 'Goedemorgen' : h < 18 ? 'Goedemiddag' : 'Goedenavond';
    const S1 = [['map', 'Plan een trip', 'Help me een rustig weekendje weg van 3 dagen plannen'], ['book', 'Leer iets', 'Leg uit hoe zwarte gaten werken in simpele woorden'], ['mail', 'Schrijf een mail', 'Schrijf een nette mail om mijn baas om een vrije dag te vragen'], ['pot', 'Kook vanavond', 'Geef me 5 makkelijke dinerideeën met kip en rijst']];
    w.innerHTML = `<div class="hero"><h2><span>${g}.<br>Hoe kan ik je helpen vandaag?</span></h2><p>${demo() ? 'Demomodus · zet je API-sleutel in GEMINI_API_KEY om echt te chatten' : 'Vraag me alles · typ / voor commando\'s'}</p><div class="chips">${S1.map(s => `<button class="chip" data-p="${esc(s[2])}"><b>${s[1]}</b><span>${s[2]}</span></button>`).join('')}</div></div>`;
  } else
    w.innerHTML = c.msgs.map((m, i) => msgHTML(m, i, i === c.msgs.length - 1)).join('');
}

function renderAll() {
  const c = chat();
  $('#title').textContent = c.title;
  document.title = c.title + ' · realjoshai';
  $('#pill').textContent = demo() ? 'Demomodus' : GEMINI_MODEL;
  renderList();
  renderMsgs();
  renderPend();
  scroll(true);
}

function scroll(f) {
  const m = $('#msgs');
  if (f || m.scrollHeight - m.scrollTop - m.clientHeight < 160) m.scrollTop = m.scrollHeight;
}
// ===========================================================================
// SENDING & STREAMING
// ===========================================================================

async function send(text, opts = {}) {
  text = text.trim();
  if ((!text && !pend.length) || busy) return;
  if (!opts.raw && text[0] === '/' && runCmd(text)) return;

  const c = chat();
  const u = { role: 'user', content: text, att: pend.length ? pend : undefined };
  const a = {
    role: 'assistant',
    content: '',
    think: opts.think || mode.think || undefined,
    search: opts.search || mode.search || undefined,
  };
  pend = [];
  c.msgs.push(u, a);
  c.ts = Date.now();
  if (c.title === 'Nieuwe chat' || c.title === 'New chat') c.title = (text || u.att[0].name).slice(0, 42);

  busy = true;
  ctrl = new AbortController();
  $('#in').value = '';
  fit();
  hideSl();
  renderAll();
  await stream(c);
}

const firstStatus = (a) => (a.search ? 'Zoeken op het web…' : a.think ? 'Nadenken…' : 'Genereren…');

function assistantBody(m, last) {
  if (m.content) return md(m.content);
  if (last && (busy || m.status)) {
    return `<span class="status"><span class="eq"><i></i><i></i><i></i></span><span class="stx">${m.status || firstStatus(m)}</span><span class="el"></span></span>`;
  }
  return '<span class="stopped">Gestopt.</span>';
}

function setStatus(a, text) {
  a.status = text;
  const el = document.querySelector('.m:last-child .status .stx');
  if (el) el.textContent = text;
}

async function stream(c) {
  const a = c.msgs[c.msgs.length - 1];
  busy = true;
  ctrl = ctrl || new AbortController();
  setBusy(true);
  setStatus(a, firstStatus(a));
  if (!document.querySelector('.m:last-child .status')) renderAll();
  scroll(true);

  const bubble = $('#w').lastElementChild.querySelector('.bub');
  const started = Date.now();
  const timer = setInterval(() => {
    const el = document.querySelector('.status .el');
    if (!el) return;
    const secs = Math.floor((Date.now() - started) / 1000);
    el.textContent = secs >= 2 ? secs + 's' : '';
  }, 500);
  const paint = () => {
    bubble.innerHTML = md(a.content) + '<span class="cur"></span>';
    scroll();
  };

  try {
    const source = demo()
      ? demoReply({ think: a.think, prompt: c.msgs[c.msgs.length - 2].content, signal: ctrl.signal })
      : streamReply({ messages: apiMsgs(c), system: sysP(), think: a.think, search: a.search, signal: ctrl.signal });

    for await (const chunk of source) {
      if (chunk.type === 'sources') {
        a.src = chunk.sources;
        continue;
      }
      if (chunk.type === 'status') {
        setStatus(a, chunk.text);
        continue;
      }
      if (chunk.type === 'reasoning') {
        if (!a.rin) {
          a.content += '<think>';
          a.rin = 1;
        }
      } else if (a.rin) {
        a.content += '</think>';
        a.rin = 0;
      }
      a.content += chunk.text;
      paint();
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      console.error(e);
      const detail = String(e.message || e).replace(/\s+/g, ' ').slice(0, 300);
      a.content += (a.content ? '\n\n' : '') + 'idk bro ✌️🫩🥀💔\n\n> ' + detail;
    }
  }

  clearInterval(timer);
  if (a.rin) {
    a.content += '</think>';
    a.rin = 0;
  }
  delete a.status;
  busy = false;
  ctrl = null;
  save();
  renderAll();
}

function setBusy(b) {
  const g = $('#go');
  document.body.classList.toggle('busy', b);
  g.innerHTML = ic(b ? 'stop' : 'send', 20);
  g.title = b ? 'Stop (Esc)' : 'Versturen';
  g.disabled = !b && !$('#in').value.trim() && !pend.length;
}
const stop = () => ctrl && ctrl.abort();
// ===========================================================================
// SLASH COMMANDS, ATTACHMENTS, VOICE
// ===========================================================================
const PER = {
  Standaard: '',
  Tutor: 'Gedraag je als een geduldige bijlesleraar: leg stap voor stap uit en check of ik het snap.',
  Schrijver: 'Gedraag je als een creatieve schrijfpartner met levendig, verzorgd taalgebruik.',
  Kok: 'Gedraag je als een vriendelijke kok: geef praktische recepten en alternatieven.',
  Vriend: 'Praat als een warme, grappige vriend. Houd het informeel.',
  Beknopt: 'Wees extreem beknopt. Gebruik zo min mogelijk woorden.',
};
const strip = (t) => t.replace(/<think>[\s\S]*?(<\/think>|$)/g, '').trim();
const sysP = () => [SYSTEM_PROMPT, PER[S.persona]].filter(Boolean).join('\n\n');

/** Chat history in a provider-neutral shape: [{ role, content, images?: [dataURL] }] */
const apiMsgs = (c) =>
  c.msgs
    .slice(0, -1)
    .filter((m) => !m.local)
    .map((m) => {
      if (m.role !== 'user') return { role: m.role, content: strip(m.content) };
      const at = m.att || [];
      const files = at.filter((f) => f.text).map((f) => `\n\n[Bijlage: ${f.name}]\n${f.text}`).join('');
      return { role: 'user', content: m.content + files, images: at.filter((f) => f.img).map((f) => f.img) };
    });

// ===========================================================================
// API LAYER  -  Gemini. Replace this section to use another provider.

/**
 * Streams a reply from Gemini (streamGenerateContent over SSE).
 *
 * Yields:
 *   { type: 'text', text }          answer tokens
 *   { type: 'reasoning', text }     thought summaries (shown in the "Denkproces" panel)
 *   { type: 'sources', sources }    [{ title, url }] from Google Search grounding
 *   { type: 'status', text }        optional status line shown while waiting
 */
async function* streamReply({ messages, system, think, search, signal }) {
  // Gemini wants alternating user/model turns with non-empty parts.
  const contents = [];
  for (const m of messages) {
    const parts = [];
    if (m.content) parts.push({ text: m.content });
    for (const img of m.images || []) {
      const hit = img.match(/^data:(.+?);base64,(.+)$/);
      if (hit) parts.push({ inlineData: { mimeType: hit[1], data: hit[2] } });
    }
    if (!parts.length) continue;
    const role = m.role === 'assistant' ? 'model' : 'user';
    const prev = contents[contents.length - 1];
    if (prev && prev.role === role) prev.parts.push(...parts);
    else contents.push({ role, parts });
  }

  const body = {
    contents,
    systemInstruction: { parts: [{ text: system }] },
    generationConfig: { temperature: +S.temp },
  };
  if (search) body.tools = [{ googleSearch: {} }];
  if (think) body.generationConfig.thinkingConfig = { thinkingBudget: 2048, includeThoughts: true };

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:streamGenerateContent?alt=sse`,
    {
      method: 'POST',
      signal,
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': GEMINI_API_KEY },
      body: JSON.stringify(body),
    }
  );
  if (!res.ok) {
    const raw = await res.text();
    let msg = raw;
    try {
      msg = JSON.parse(raw).error.message;
    } catch {}
    throw new Error(`API ${res.status}: ${msg}`);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  const seen = new Map();
  let buffer = '';
  let got = false;
  let finish = '';

  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (!line.startsWith('data:')) continue;
      let data;
      try {
        data = JSON.parse(line.slice(5).trim());
      } catch {
        continue;
      }
      if (data.promptFeedback?.blockReason) throw new Error('Geblokkeerd: ' + data.promptFeedback.blockReason);

      const cand = data.candidates?.[0];
      if (cand?.finishReason) finish = cand.finishReason;

      for (const part of cand?.content?.parts || []) {
        if (!part.text) continue;
        got = true;
        yield { type: part.thought ? 'reasoning' : 'text', text: part.text };
      }

      const chunks = cand?.groundingMetadata?.groundingChunks;
      if (chunks) {
        const before = seen.size;
        for (const ch of chunks) if (ch.web?.uri) seen.set(ch.web.uri, ch.web.title || 'Bron');
        if (seen.size !== before) {
          yield { type: 'sources', sources: [...seen].map(([url, title]) => ({ title, url })) };
        }
      }
    }
  }
  if (!got) throw new Error('Geen antwoord ontvangen' + (finish ? ` (${finish})` : ''));
}

/** Offline demo used while GEMINI_API_KEY is still the placeholder. Same contract as streamReply. */
async function* demoReply({ think, prompt, signal }) {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const words = (t) => t.split(/(?<=\s)/);
  await wait(1400);
  if (think) {
    for (const w of words('Dit is demomodus, ik laat alleen zien hoe het denkpaneel eruitziet.')) {
      if (signal.aborted) return;
      yield { type: 'reasoning', text: w };
      await wait(40);
    }
    await wait(300);
  }
  const reply =
    'Je zit in **demomodus** omdat er nog geen API-sleutel is ingesteld.\n\n' +
    'Zet je sleutel in `GEMINI_API_KEY` bovenaan het script en herlaad de pagina.\n\n' +
    '> Jij zei: ' + prompt;
  for (const w of words(reply)) {
    if (signal.aborted) return;
    yield { type: 'text', text: w };
    await wait(22);
  }
}

let sli = 0, slv = [];

const shrink = f => new Promise((ok, no) => {
  const i = new Image();
  i.onload = () => {
    const k = Math.min(1, 900 / Math.max(i.width, i.height)), c = document.createElement('canvas');
    c.width = i.width * k;
    c.height = i.height * k;
    c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
    ok(c.toDataURL('image/jpeg', .75));
  };
  i.onerror = no;
  i.src = URL.createObjectURL(f);
});

async function addFiles(fs) {
  for (const f of fs) {
    try {
      if (f.type.startsWith('image/'))
        pend.push({ name: f.name, img: await shrink(f) });
      else if (f.size > 2e6) toast(f.name + ' is te groot');
      else
        pend.push({ name: f.name, text: (await f.text()).slice(0, 30000) });
    } catch {
      toast('Kan niet lezen: ' + f.name);
    }
  }
  renderPend();
}

function renderPend() {
  $('#pend').innerHTML = pend.map((f, i) => `<span class="tp">${f.img ? `<img class="thumb" src="${f.img}">` : ic('clip', 13)}${esc(f.name)} <button data-x="${i}">✕</button></span>`).join('');
  setBusy(busy);
}

const KW = /\b(function|const|let|var|return|if|else|for|while|class|import|from|export|def|in|of|new|async|await|try|catch|throw|true|false|null|None|True|False|self|this|public|private|static|void|int|string|fn|func|use|pub|struct|enum|SELECT|FROM|WHERE)\b/g;

function hl(c, l) {
  const py = /^(py|python|sh|bash|shell|yaml|yml|rb|ruby|toml)$/i.test(l || '');
  const re = py ? /(#[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')/g : /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)/g;
  let o = '', i = 0, m;
  const plain = t => esc(t).replace(KW, '<span class="tk">$1</span>').replace(/\b(\d+\.?\d*)\b/g, '<span class="tn">$1</span>');
  while (m = re.exec(c)) {
    o += plain(c.slice(i, m.index)) + `<span class="${m[1] ? 'tc' : 'ts'}">${esc(m[0])}</span>`;
    i = m.index + m[0].length;
  }
  return `<pre><code>${o + plain(c.slice(i))}</code></pre>`;
}

  if (e.key === 'Escape' && busy) stop();
});
matchMedia('(prefers-color-scheme:dark)').onchange = theme;
icons();
theme();
pills();
persona();
document.body.classList.toggle('col', !!S.col && innerWidth > 800);
if (!chats.length) newChat();
else {

  renderAll();
}
